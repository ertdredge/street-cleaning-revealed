<text x="360" y="744" font-size="14" text-anchor="middle" font-weight="400" fill="#6f6f6a">window</text>
<text x="360" y="762" font-size="13" text-anchor="middle" font-weight="400" fill="#6f6f6a">105 × 160 cm</text>
<line x1="250" y1="910" x2="470" y2="910" stroke="#4a3fb8" stroke-width="10" stroke-linecap="round"/>
