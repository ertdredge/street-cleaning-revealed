<text x="484" y="778" font-size="12" text-anchor="start" font-weight="400" fill="#b9791f">bottom → top</text>
<circle cx="470" cy="910" r="9" fill="none" stroke="#d9504f" stroke-width="2.5"/>
<text x="360" y="954" font-size="12" text-anchor="middle" font-weight="600" fill="#d9504f">both cables enter at the lower-right corner (hole in the window casing)</text>
<circle cx="250" cy="910" r="6" fill="#ffffff" stroke="#6f6f6a" stroke-width="2"/>
<circle cx="470" cy="590" r="6" fill="#ffffff" stroke="#6f6f6a" stroke-width="2"/>
<line x1="242" y1="582" x2="258" y2="598" stroke="#d9504f" stroke-width="2.5" stroke-linecap="round"/>
<line x1="242" y1="598" x2="258" y2="582" stroke="#d9504f" stroke-width="2.5" stroke-linecap="round"/>
<text x="232" y="582" font-size="12" text-anchor="end" font-weight="400" fill="#d9504f">✕ sealed dead ends</text>
<text x="232" y="598" font-size="12" text-anchor="end" font-weight="400" fill="#d9504f">(left DO + top DO)</text>
<text x="484" y="582" font-size="12" text-anchor="start" font-weight="400" fill="#6f6f6a">join (right DO → top DI)</text>
<text x="232" y="928" font-size="12" text-anchor="end" font-weight="400" fill="#6f6f6a">join (bottom DO → left DI)</text>
<rect x="30" y="650" width="12" height="12" rx="2" fill="#4a3fb8" stroke="#4a3fb8" stroke-width="1"/>
<text x="48" y="661" font-size="12" text-anchor="start" font-weight="400" fill="#1f1f1d">Run A: GPIO 2 / LED1, 5A_1</text>
<rect x="30" y="670" width="12" height="12" rx="2" fill="#b9791f" stroke="#b9791f" stroke-width="1"/>
<text x="48" y="681" font-size="12" text-anchor="start" font-weight="400" fill="#1f1f1d">Run B: GPIO 4 / LED2, 5A_2</text>
<rect x="620" y="556" width="320" height="372" rx="6" fill="#f1efe9" stroke="#8a8a84" stroke-width="1.5"/>
<text x="634" y="580" font-size="15" text-anchor="start" font-weight="600" fill="#1f1f1d">Before the first power-up</text>
<text x="634" y="604.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• Supply cable: center conductor = +12 V,</text>
<text x="634" y="622.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  outer strands = − (verify with a meter).</text>
<text x="634" y="641.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• Ferrules on both leads (twisted + folded is</text>
<text x="634" y="659.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  bench-only: recheck for warmth).</text>
<text x="634" y="678.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• All grounds are one net; BI tied to GND at</text>
<text x="634" y="696.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  each run's head.</text>
<text x="634" y="715.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• 5 A fuse per run: 150 px is about 3.8 A at</text>
<text x="634" y="733.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  full white and brightness 255 (25 mA/px).</text>
<text x="634" y="752.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• MAX_BRIGHT 128 keeps the worst case near</text>
<text x="634" y="770.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  3.8 A in total (supply is 6.67 A).</text>
<text x="634" y="789.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• Strips get NO power until the sketch sets</text>
<text x="634" y="807.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  GPIO 20 and 22 (HIGH assumed): check with a</text>
<text x="634" y="826.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  meter and `relay on|off` before connecting.</text>
<text x="634" y="844.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• GPIO 2 (LED1) is a boot-strapping pin: if</text>
<text x="634" y="863.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  flashing fails, disconnect the LED1 data.</text>
<text x="634" y="881.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• Supply indoors, earthed cord, GFCI outlet.</text>
<text x="634" y="900.0" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">• All GPIO are 3.3 V only. USB-C 5 V never</text>
<text x="634" y="918.5" font-size="12.5" text-anchor="start" font-weight="400" fill="#1f1f1d">  powers the LEDs.</text>
</svg>
