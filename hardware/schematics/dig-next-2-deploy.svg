<text x="360" y="630" font-size="11" text-anchor="middle" font-weight="400" fill="#6f6f6a">typical</text>
<text x="430" y="630" font-size="11" text-anchor="middle" font-weight="400" fill="#6f6f6a">hot</text>
<text x="360" y="576" font-size="12" text-anchor="middle" font-weight="400" fill="#b9791f">top · 60 px · idx 240–299 · right → left</text>
<text x="360" y="932" font-size="12" text-anchor="middle" font-weight="400" fill="#4a3fb8">bottom · 60 px · idx 0–59 · right → left</text>
<text x="236" y="730" font-size="12" text-anchor="end" font-weight="600" fill="#4a3fb8">left</text>
<text x="236" y="746" font-size="12" text-anchor="end" font-weight="400" fill="#4a3fb8">90 px</text>
<text x="236" y="762" font-size="12" text-anchor="end" font-weight="400" fill="#4a3fb8">idx 60–149</text>
<text x="236" y="778" font-size="12" text-anchor="end" font-weight="400" fill="#4a3fb8">bottom → top</text>
