<text x="612" y="354" font-size="13" text-anchor="end" font-weight="400" fill="#4a3fb8">LED2 data · GPIO 4</text>
<text x="612" y="379" font-size="13" text-anchor="end" font-weight="400" fill="#4a3fb8">5A_2 + · fuse 5 A</text>
<text x="612" y="404" font-size="13" text-anchor="end" font-weight="400" fill="#4a3fb8">5A_2 GND</text>
<text x="342" y="432" font-size="12" text-anchor="start" font-weight="400" fill="#4a3fb8">MOSFET relay on each + output:</text>
<text x="342" y="448" font-size="12" text-anchor="start" font-weight="400" fill="#4a3fb8">5A_1 GPIO 20 · 10A_1 GPIO 21 · 5A_2 GPIO 22</text>
<text x="342" y="462" font-size="12" text-anchor="start" font-weight="600" fill="#4a3fb8">off until the sketch sets it (HIGH assumed)</text>
