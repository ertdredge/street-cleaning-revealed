<text x="830" y="246" font-size="11" text-anchor="middle" font-weight="400" fill="#6f6f6a">BI (backup data) tied to GND at the head</text>
<text x="830" y="262" font-size="11" text-anchor="middle" font-weight="400" fill="#6f6f6a">pigtail colors as observed on the bench</text>
