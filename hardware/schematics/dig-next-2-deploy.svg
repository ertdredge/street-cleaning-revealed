<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 985" role="img" font-family="Helvetica, Arial, sans-serif">
<title>Deployment wiring: QuinLED Dig-Next-2 and Mean Well GST90A12-P1M driving two 150-pixel WS2815 runs</title>
<desc>A 12 V Mean Well supply feeds the Dig-Next-2 main input. The 5A_1 and 5A_2 fused outputs power run A (bottom strip then left strip) and run B (right strip then top strip); LED1 (GPIO 2) and LED2 (GPIO 4) carry the data. Relay pins GPIO 20 and 22 must be on for the outputs to have power. Both runs start at the lower-right corner of the window frame.</desc>
<rect width="960" height="985" fill="#ffffff"/>
