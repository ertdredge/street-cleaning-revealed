<text x="280" y="248" font-size="11" text-anchor="middle" font-weight="400" fill="#6f6f6a">7.5–10 A fuse</text>
<rect x="262" y="259" width="36" height="12" rx="0" fill="#ffffff" stroke="#6f6f6a" stroke-width="2" stroke-dasharray="4 3"/>
<text x="280" y="285" font-size="12" text-anchor="middle" font-weight="400" fill="#1f1f1d">14 AWG</text>
